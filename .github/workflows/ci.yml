name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Headless Chromium for the browse tests. They only load a local fixture page.
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
