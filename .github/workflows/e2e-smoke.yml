# Required status check: e2e-smoke / e2e-smoke
# Add it in a branch ruleset on main after this workflow has run once.
# Secrets (repository settings, not in this file):
#   SMOKE_TEST_EMAIL
#   SMOKE_TEST_PASSWORD
#   VERCEL_TOKEN
#   VERCEL_AUTOMATION_BYPASS_SECRET

name: e2e-smoke

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the Vercel deployment
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_8eZarx7J93N9I98K1Tpwo4tVi5yR
          VERCEL_TEAM_ID: team_i7qtAESwPEcnE6oij072KIei
          DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEPLOYMENT_TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: npx tsx e2e/wait-for-vercel-deployment.ts
      - name: Sign in and out against the deployment
        env:
          SMOKE_BASE_URL: ${{ steps.deployment.outputs.url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
